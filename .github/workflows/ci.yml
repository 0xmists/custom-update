name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: |
          set -e
          find scripts/ -name '*.sh' | while read f; do
            shellcheck "$f"
          done

  bash-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          set -e
          # Check that all .sh files are valid bash
          find scripts/ tests/ -name '*.sh' | while read f; do
            bash -n "$f" || { echo "SYNTAX ERROR in $f"; exit 1; }
          done
          echo "All bash files pass syntax check."

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bash -n on all shell scripts
        run: |
          set -e
          find scripts/ tests/ -name '*.sh' -exec bash -n {} \;
          echo "All shell scripts pass bash -n check."

  test:
    runs-on: ubuntu-latest
    needs: [shellcheck, bash-format, bash-syntax]
    steps:
      - uses: actions/checkout@v4
      - name: Run test suite
        run: |
          set -e
          chmod +x tests/run-tests.sh
          chmod +x tests/unit/*.sh
          chmod +x tests/integration/*.sh
          chmod +x tests/regression/*.sh
          bash tests/run-tests.sh

  regression:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: |
          set -e
          bash tests/run-tests.sh --regression

  full-suite:
    runs-on: ubuntu-latest
    needs: [shellcheck, bash-format, bash-syntax, test, regression]
    steps:
      - uses: actions/checkout@v4
      - name: Full test suite
        run: |
          set -e
          bash tests/run-tests.sh
        timeout-minutes: 10

  # Fail the workflow if any regression is detected.
  gate:
    runs-on: ubuntu-latest
    needs: [full-suite]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.full-suite.result }}" != "success" ]]; then
            echo "::error::CI gate failed — do not merge"
            exit 1
          fi
          echo "All CI checks passed."